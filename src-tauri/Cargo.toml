[package]
name = "ps4-downloader"
version = "0.1.0"
description = "Download manager for large, user-authorized files"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ps4_downloader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "http2", "stream"] }
percent-encoding = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
